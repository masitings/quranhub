version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quranhub_app
    environment:
      DB_USERNAME: ${DB_USERNAME:-quranhub}
      DB_PASSWORD: ${DB_PASSWORD:-quranhub_password}
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-quranhub}
      # Construct DATABASE_URL from components (URL encoding for special characters in password)
      DATABASE_URL: postgresql://${DB_USERNAME:-quranhub}:${DB_PASSWORD:-quranhub_password}@${DB_HOST:-localhost}:${DB_PORT:-5432}/${DB_NAME:-quranhub}
    # Port mapping - Dokploy will handle this automatically via reverse proxy
    # Keep this for local development or if Dokploy doesn't auto-detect
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/liveness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

